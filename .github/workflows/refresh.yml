name: Refresh deals

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape deals
        run: python3 scripts/scrape.py

      - name: Commit fresh data
        run: |
          git config user.name "ultraulta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deals.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "refresh deals $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
